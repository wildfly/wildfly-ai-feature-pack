name: Maven
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        # Keep this list as: all supported LTS JDKs, the latest GA JDK, and optionally the latest EA JDK (if available).
        # Reference: https://adoptium.net/support/
        java:
          - 17
          - 21
          - 25
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build with Maven
        # The module 'wildfly-ai-feature-pack' requires the 'install' goal
        run: ./mvnw -Pmcp-conformance --batch-mode --no-transfer-progress clean install
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.os }}-${{ matrix.java }}-test-reports
          path: |
            **/surefire-reports*/*
            **/failsafe-reports*/*
      - name: Verify central-release profile builds
        if: matrix.os == 'ubuntu-latest' && matrix.java == 17
        run: >
          mvn --batch-mode --no-transfer-progress install
          -Pcentral-release
          -DskipTests
          -Dgpg.skip=true
