mcp=The MCP subsystem
mcp.add=This operation adds the mcp subsystem
mcp.remove=This operation removes the mcp subsystem
mcp.sse-path=This is the context path for the SSE endpoint
mcp.messages-path=This is the context path for the messages endpoint
mcp.streamable-path=This is the context path for the streamable endpoint
mcp.page-size=Maximum number of items per paginated list response (tools, prompts, resources, resource templates). A value of 0 disables pagination and returns all items.
mcp.timeout=Idle connection timeout in seconds. Connections that have been inactive for longer than this value will be automatically closed.
mcp.request-timeout=Maximum time to wait for a single request (e.g. tool call) to complete before returning a timeout error. Defaults to 5 minutes.
mcp.credential-reference=Credential (from a Credential Store), holding a secret key, used to sign requestState tokens for multi-round tool results. When set, enables MRTR support; tokens survive restarts and are valid across cluster members sharing the same secret.
mcp.credential-reference.store=The name of the credential store holding the alias to credential
mcp.credential-reference.type=The type of credential this reference is denoting
mcp.credential-reference.alias=The alias which denotes stored secret or credential in the store
mcp.credential-reference.clear-text=Not supported for MCP requestState signing; configure a credential store alias containing a SecretKeyCredential instead.
mcp.allowed-origins=List of additional hostnames or origins allowed by DNS rebinding validation. Localhost addresses are always permitted. Use this to allow external hostnames that legitimately reach the server.
mcp.cache-ttl=Default cache TTL in milliseconds for list and discover responses. Defaults to 3600000 (1 hour). A value of 0 disables cache TTL emission.
mcp.cache-scope=Default cache scope for list and discover responses. Valid values are "public" and "private". Defaults to "public".

# Deployment model
mcp.deployment=MCP features deployed with this application
