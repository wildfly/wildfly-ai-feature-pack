mcp.deployment.tool.description=Description of the MCP tool
mcp.deployment.tool.title=Human-readable title of the MCP tool
mcp.deployment.prompt=An MCP prompt exposed by this deployment
mcp.deployment.prompt.description=Description of the MCP prompt
mcp.deployment.resource=An MCP resource exposed by this deployment
mcp.deployment.resource.description=Description of the MCP resource
mcp.deployment.resource.mime-type=MIME type of the MCP resource content
mcp.deployment.resource.title=Human-readable title of the MCP resource
mcp.deployment.resource-template=An MCP resource template exposed by this deployment
mcp.deployment.resource-template.description=Description of the MCP resource template
mcp.deployment.resource-template.mime-type=MIME type of the MCP resource template content
mcp.deployment.resource-template.title=Human-readable title of the MCP resource template
